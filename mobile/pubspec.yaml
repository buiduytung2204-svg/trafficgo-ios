name: trafficgo
description: Bản đồ và giao thông Hà Nội.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  dio: ^5.9.0
  http: ^1.5.0
  url_launcher: ^6.3.2
  flutter_riverpod: ^3.0.0
  go_router: ^16.2.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^19.4.2
  timezone: 0.10.1
  forui: 0.27.6
  shadcn_ui: 0.57.3
  wolt_modal_sheet: 0.11.0
  fl_chart: 1.3.0
  flutter_animate: 4.5.2
  animated_toggle_switch: 0.8.7
  google_mobile_ads: 9.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/honda_vn_maintenance.json
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
