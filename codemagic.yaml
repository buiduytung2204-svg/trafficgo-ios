workflows:
  ios-unsigned:
    name: TrafficGo iOS unsigned verification
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: https://backend.example.invalid
    scripts:
      - name: Flutter dependencies and checks
        script: |
          cd mobile
          flutter config --no-enable-swift-package-manager
          flutter --version
          flutter pub get
          flutter analyze
          flutter test
      - name: iOS dependencies
        script: |
          cd mobile/ios
          pod install
      - name: Unsigned device app
        script: |
          cd mobile
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL=$API_BASE_URL
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/TrafficGo-unsigned.app.zip
      - name: Unsigned archive
        script: |
          cd mobile/ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -archivePath ../build/ios/archive/TrafficGo.xcarchive archive CODE_SIGNING_ALLOWED=NO
    artifacts:
      - mobile/build/ios/*.zip
      - mobile/build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
  ios-signed:
    name: TrafficGo signed IPA (manual trigger after credentials)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: vn.trafficgo.trafficgo
      vars:
        API_BASE_URL: https://backend.example.invalid
    scripts:
      - name: Verify
        script: |
          cd mobile
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter analyze
          flutter test
      - name: Apply uploaded signing profiles
        script: xcode-project use-profiles
      - name: Export signed IPA
        script: |
          cd mobile
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist --dart-define=API_BASE_URL=$API_BASE_URL
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - mobile/build/ios/archive/*.xcarchive

